server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Root sends visitors to the default locale.
    location = / {
        return 302 /en-US/;
    }

    # English SPA — client-side routes fall back to its index.html.
    location /en-US/ {
        try_files $uri $uri/ /en-US/index.html;
    }

    # Spanish SPA — base href is /es/, files live under /es/.
    location /es/ {
        try_files $uri $uri/ /es/index.html;
    }

    # Hashed assets (any locale) — long-lived immutable cache. Real file or 404,
    # never the SPA fallback, so a missing asset surfaces instead of returning HTML.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell (hash changes each build).
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
