<div class="flex flex-col gap-5">
  <lz-page-header title="Schedule" i18n-title="@@schedule.title">
    <div lzHeaderMeta class="mt-2">
      <label class="flex items-center gap-2">
        <mat-icon aria-hidden="true" class="text-ink-soft">place</mat-icon>
        <select lzField class="sm:w-auto" aria-label="Location" i18n-aria-label="@@schedule.location_label" (change)="filterByLocation($event)">
          <option value="" i18n="@@schedule.all_locations">All locations</option>
          <option *ngFor="let location of locations" [value]="location.locationId">{{ location.name }}</option>
        </select>
      </label>
    </div>
  </lz-page-header>

  <lz-alert tone="info" *ngIf="loading"><ng-container i18n="@@common.loading_short">Loading...</ng-container></lz-alert>
  <lz-alert tone="danger" *ngIf="error" i18n="@@schedule.error">Error loading schedule.</lz-alert>

  <div class="rounded-panel border border-line bg-paper p-4 shadow-card">
    <full-calendar #calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>
