<div class="fixed inset-0 z-[999] flex items-start justify-center overflow-y-auto p-4">
  <div class="fixed inset-0 bg-navy-900/40" aria-hidden="true" (click)="onClose()"></div>
  <div
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [attr.aria-labelledby]="frame.titleId"
    class="relative my-auto w-full max-w-lg rounded-dialog border border-line bg-paper shadow-overlay"
  >
    <lz-dialog-frame #frame title="Report sick" i18n-title="@@sick_report.title" (closed)="onClose()">
      <div class="space-y-4">
        <lz-field label="Employee" i18n-label="@@sick_report.employee" controlId="person-name">
          <input lzField type="text" id="person-name" [value]="personName" disabled />
        </lz-field>

        <div class="grid gap-4 sm:grid-cols-2">
          <lz-field label="Sick date" i18n-label="@@sick_report.sick_date" controlId="start-date">
            <input lzField type="date" id="start-date" cdkFocusInitial [(ngModel)]="startDate" />
          </lz-field>
          <lz-field *ngIf="isMultiDay" label="End date" i18n-label="@@sick_report.end_date" controlId="end-date">
            <input lzField type="date" id="end-date" [(ngModel)]="endDate" />
          </lz-field>
        </div>

        <label class="flex min-h-12 items-center gap-3">
          <input type="checkbox" class="size-5 accent-ink" [(ngModel)]="isMultiDay" />
          <span i18n="@@sick_report.multiple_days">Multiple days</span>
        </label>

        <lz-field label="Symptoms (optional)" i18n-label="@@sick_report.symptoms" controlId="symptoms">
          <input
            lzField
            type="text"
            id="symptoms"
            placeholder="e.g., Fever, Headache, Cough"
            i18n-placeholder="@@sick_report.symptoms_ph"
            [(ngModel)]="symptoms"
          />
        </lz-field>

        <label class="flex min-h-12 items-center gap-3">
          <input type="checkbox" class="size-5 accent-ink" [(ngModel)]="requiresDoctor" />
          <span i18n="@@sick_report.doctor_note">Requires doctor's note</span>
        </label>

        <lz-field label="Additional notes (optional)" i18n-label="@@sick_report.notes" controlId="note">
          <textarea
            lzField
            id="note"
            class="py-2"
            rows="3"
            placeholder="Provide additional details..."
            i18n-placeholder="@@sick_report.notes_ph"
            [(ngModel)]="note"
          ></textarea>
        </lz-field>

        <lz-alert tone="info" i18n="@@sick_report.info_msg">Reporting sick will automatically mark your scheduled shifts as "open" for the selected date(s).</lz-alert>

        <lz-alert tone="danger" *ngIf="errorMessage">{{ errorMessage }}</lz-alert>
      </div>

      <button lzDialogActions lzButton variant="secondary" type="button" (click)="onClose()" [disabled]="submitting" i18n="@@common.cancel">Cancel</button>
      <button lzDialogActions lzButton variant="primary" type="button" (click)="onSubmit()" [disabled]="submitting">
        <ng-container *ngIf="!submitting" i18n="@@sick_report.submit">Report sick</ng-container>
        <ng-container *ngIf="submitting" i18n="@@sick_report.submitting">Submitting...</ng-container>
      </button>
    </lz-dialog-frame>
  </div>
</div>
