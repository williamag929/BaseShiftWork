<lz-dialog-overlay placement="end" ariaLabel="Find replacement" i18n-ariaLabel="@@replacement.title" (closed)="onClose()">
  <lz-panel heading="Find replacement" i18n-heading="@@replacement.title" class="min-h-full !rounded-none !border-0">
    <button
      lzPanelActions
      lzButton
      variant="quiet"
      iconOnly
      type="button"
      aria-label="Close"
      i18n-aria-label="@@common.close_aria"
      (click)="onClose()"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>

    <div class="space-y-4">
      <fieldset class="m-0 border-0 p-0">
        <legend class="mb-1 font-medium" i18n="@@replacement.notify_via">Notify via</legend>
        <div class="flex flex-wrap gap-x-4">
          <label class="flex min-h-12 items-center gap-3">
            <input type="radio" name="channel" value="push" class="size-5 accent-ink" cdkFocusInitial [(ngModel)]="selectedChannel" />
            <ng-container i18n="@@replacement.push">Push</ng-container>
          </label>
          <label class="flex min-h-12 items-center gap-3">
            <input type="radio" name="channel" value="sms" class="size-5 accent-ink" [(ngModel)]="selectedChannel" />
            <ng-container i18n="@@replacement.sms">SMS</ng-container>
          </label>
          <label class="flex min-h-12 items-center gap-3">
            <input type="radio" name="channel" value="email" class="size-5 accent-ink" [(ngModel)]="selectedChannel" />
            <ng-container i18n="@@replacement.email">Email</ng-container>
          </label>
        </div>
      </fieldset>

      <lz-alert tone="info" *ngIf="loading"><ng-container i18n="@@replacement.loading">Finding candidates...</ng-container></lz-alert>

      <lz-empty-state
        *ngIf="!loading && candidates.length === 0"
        icon="person_search"
        title="No available candidates for this time window."
        i18n-title="@@replacement.no_candidates"
        body="All employees are either scheduled or have reported sick/time off."
        i18n-body="@@replacement.no_candidates_help"
      />

      <ul class="m-0 list-none space-y-3 p-0" *ngIf="!loading && candidates.length > 0">
        <li *ngFor="let candidate of candidates" class="space-y-3 rounded-control border border-line p-3">
          <div class="space-y-1">
            <p class="m-0 font-medium">{{ candidate.name }}</p>
            <div class="flex flex-wrap gap-1" *ngIf="candidate.reasons && candidate.reasons.length > 0">
              <lz-status-chip tone="neutral" *ngFor="let reason of candidate.reasons">{{ reason }}</lz-status-chip>
            </div>
            <p class="m-0 text-ink-soft" *ngIf="candidate.score" i18n="@@replacement.match_score">Match: {{ candidate.score }}%</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button lzButton variant="secondary" type="button" (click)="onNotify(candidate.personId)">
              <mat-icon aria-hidden="true">notifications</mat-icon>
              <ng-container i18n="@@replacement.notify">Notify</ng-container>
            </button>
            <button lzButton variant="secondary" type="button" (click)="onAssign(candidate.personId)">
              <mat-icon aria-hidden="true">check_circle</mat-icon>
              <ng-container i18n="@@replacement.assign">Assign</ng-container>
            </button>
          </div>
        </li>
      </ul>

      <p class="m-0 text-ink-soft" i18n="@@replacement.footer">Candidates are filtered by availability and conflicts.</p>
    </div>
  </lz-panel>
</lz-dialog-overlay>
