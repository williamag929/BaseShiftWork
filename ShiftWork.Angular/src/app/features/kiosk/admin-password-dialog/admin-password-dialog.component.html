<lz-dialog-frame title="Admin password required" i18n-title="@@kiosk_admin_pwd.title" [closable]="false">
  <div class="space-y-4">
    <p class="m-0 text-lg" i18n="@@kiosk_admin_pwd.description">Enter administrator password to change device location assignment:</p>

    <lz-field label="Admin password" i18n-label="@@kiosk_admin_pwd.password_label" controlId="kiosk-admin-password">
      <input lzField id="kiosk-admin-password" type="password" class="min-h-14! text-lg!" autocomplete="off"
             [(ngModel)]="password" name="password" (keyup.enter)="onVerify()" [disabled]="isVerifying" cdkFocusInitial>
    </lz-field>

    @if (errorMessage) {
      <lz-alert tone="danger" class="text-lg">{{ errorMessage }}</lz-alert>
    }
    @if (isVerifying) {
      <div role="status" class="flex items-center gap-3 text-lg text-ink-soft">
        <mat-spinner diameter="24" aria-hidden="true"></mat-spinner>
        <span i18n="@@kiosk_admin_pwd.verifying">Verifying...</span>
      </div>
    }
  </div>

  <div lzDialogActions class="flex w-full gap-3">
    <button type="button" lzButton variant="secondary" class="min-h-14! flex-1 text-lg!" (click)="onNoClick()" [disabled]="isVerifying" i18n="@@common.cancel">Cancel</button>
    <button type="button" lzButton variant="primary" class="min-h-14! flex-1 text-lg!" [disabled]="!password || isVerifying" (click)="onVerify()" i18n="@@kiosk_admin_pwd.verify_btn">Verify</button>
  </div>
</lz-dialog-frame>
