<lz-dialog-frame title="Select location" i18n-title="@@kiosk_location.title" [closable]="closable" (closed)="onNoClick()">
  <div class="space-y-4">
    <lz-field label="Locations" i18n-label="@@kiosk_location.locations_label" controlId="kiosk-location">
      <select lzField id="kiosk-location" class="min-h-14! text-lg!" [(ngModel)]="selectedLocation" name="location" cdkFocusInitial>
        @for (location of data.locations; track location.locationId) {
          <option [ngValue]="location">{{ location.name }}</option>
        }
      </select>
    </lz-field>

    <label class="flex min-h-14 items-center gap-3 text-lg">
      <input type="checkbox" class="size-6 shrink-0 accent-(--lz-link)" [(ngModel)]="assignToDevice" name="assignToDevice">
      <span i18n="@@kiosk_location.assign_device">Assign this location to this device permanently</span>
    </label>
  </div>

  <div lzDialogActions class="flex w-full gap-3">
    <button type="button" lzButton variant="secondary" class="min-h-14! flex-1 text-lg!" (click)="onNoClick()" i18n="@@common.cancel">Cancel</button>
    <button type="button" lzButton variant="primary" class="min-h-14! flex-1 text-lg!" [disabled]="!selectedLocation" (click)="onSelectClick()" i18n="@@kiosk_location.select_btn">Select</button>
  </div>
</lz-dialog-frame>
