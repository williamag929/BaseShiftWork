<h1 mat-dialog-title i18n="@@kiosk_location.title">Select Location</h1>
<div mat-dialog-content>
  <mat-form-field>
    <mat-label i18n="@@kiosk_location.locations_label">Locations</mat-label>
    <mat-select #locationSelect [(ngModel)]="selectedLocation">
      <mat-option *ngFor="let location of data.locations" [value]="location">
        {{location.name}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div style="margin-top: 16px;">
    <mat-checkbox [(ngModel)]="assignToDevice" i18n="@@kiosk_location.assign_device">
      Assign this location to this device permanently
    </mat-checkbox>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()" i18n="@@common.cancel">Cancel</button>
  <button mat-button [disabled]="!selectedLocation" (click)="onSelectClick()" cdkFocusInitial i18n="@@kiosk_location.select_btn">Select</button>
</div>
