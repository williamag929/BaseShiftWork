<div class="toolbar">
  <div class="search-container">
    <input type="text" [formControl]="searchControl"
           placeholder="Search employees..."
           i18n-placeholder="@@kiosk_employees.search_ph"
           class="search-input">
  </div>
  <div class="status-controls">
    <button class="btn btn-sm btn-outline-primary" (click)="refreshStatuses()" [disabled]="refreshing">
      <ng-container *ngIf="!refreshing" i18n="@@kiosk_employees.refresh_btn">Refresh</ng-container>
      <ng-container *ngIf="refreshing" i18n="@@kiosk_employees.refreshing">Refreshing...</ng-container>
    </button>
    <div class="last-updated" *ngIf="lastUpdated as lu">
      <ng-container i18n="@@kiosk_employees.last_updated">Last updated:</ng-container> {{ lu | date:'shortTime' }}
    </div>
  </div>
  <div class="legend-toggle">
    <button class="btn btn-sm btn-outline-secondary" (click)="toggleLegend()" [attr.aria-expanded]="showLegend" aria-controls="legend-desktop legend-mobile"
            i18n-aria-label="@@kiosk_employees.legend_toggle_aria" aria-label="Toggle timing legend visibility">
      <ng-container i18n="@@kiosk_employees.legend_btn">Legend</ng-container>
      <i class="ms-1" [ngClass]="{ 'bi bi-chevron-up': showLegend, 'bi bi-chevron-down': !showLegend }"></i>
    </button>
    <button type="button" class="btn btn-sm btn-link info-icon"
            title="Legend: OnTime = within 5 minutes of scheduled start; Early = before start; Late = more than 5 minutes after start; NoSchedule = no published schedule for today"
            i18n-aria-label="@@kiosk_employees.legend_info_aria" aria-label="Legend information">
      <i class="bi bi-info-circle"></i>
    </button>
  </div>
  <div class="wake-lock-indicator ms-2" *ngIf="wakeLock.isSupported()"
       i18n-title="@@kiosk_employees.wake_lock_active_title" title="Screen wake lock active to prevent sleep">
    <span class="badge bg-secondary" [class.bg-success]="wakeLock.isActive()">
      <ng-container *ngIf="wakeLock.isActive()" i18n="@@kiosk_employees.screen_locked">Screen Locked</ng-container>
      <ng-container *ngIf="!wakeLock.isActive()" i18n="@@kiosk_employees.screen_sleep">Screen May Sleep</ng-container>
    </span>
  </div>
  <div class="wake-lock-indicator ms-2" *ngIf="!wakeLock.isSupported()"
       i18n-title="@@kiosk_employees.wake_lock_unsupported_title" title="Wake Lock not supported on this device">
    <span class="badge bg-secondary" i18n="@@kiosk_employees.wake_lock_unsupported">Wake Lock Unsupported</span>
  </div>
  <div id="legend-desktop" class="legend desktop-only" i18n-aria-label="@@kiosk_employees.legend_aria" aria-label="Timing legend" role="region" *ngIf="showLegend">
    <span class="badge bg-success" i18n-title="@@kiosk_employees.ontime_title" title="Arrived within 5 minutes of scheduled start" i18n="@@kiosk_employees.ontime">OnTime</span>
    <span class="badge bg-warning text-dark" i18n-title="@@kiosk_employees.early_title" title="Arrived before scheduled start" i18n="@@kiosk_employees.early">Early</span>
    <span class="badge bg-danger" i18n-title="@@kiosk_employees.late_title" title="Arrived more than 5 minutes after scheduled start" i18n="@@kiosk_employees.late">Late</span>
  </div>

  <div *ngIf="refreshing" class="inline-spinner" i18n-aria-label="@@kiosk_employees.refreshing_aria" aria-label="Refreshing statuses">
    <div class="spinner-border spinner-border-sm" role="status"></div>
  </div>
</div>

<div *ngIf="loading" class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only" i18n="@@common.loading_short">Loading...</span>
  </div>
</div>

<!-- Mobile legend placed under the grid -->
<div id="legend-mobile" class="legend mobile-only" i18n-aria-label="@@kiosk_employees.legend_aria" aria-label="Timing legend" role="region" *ngIf="showLegend">
  <span class="badge bg-success" i18n-title="@@kiosk_employees.ontime_title" title="Arrived within 5 minutes of scheduled start" i18n="@@kiosk_employees.ontime">OnTime</span>
  <span class="badge bg-warning text-dark" i18n-title="@@kiosk_employees.early_title" title="Arrived before scheduled start" i18n="@@kiosk_employees.early">Early</span>
  <span class="badge bg-danger" i18n-title="@@kiosk_employees.late_title" title="Arrived more than 5 minutes after scheduled start" i18n="@@kiosk_employees.late">Late</span>
</div>
<div *ngIf="error" class="alert alert-danger" i18n="@@kiosk_employees.error">
  Error loading employees.
</div>

<div *ngIf="!loading && filteredEmployees.length === 0" class="text-center">
  <p i18n="@@kiosk_employees.empty">No employees found.</p>
</div>

<div class="employee-grid">
  <div *ngFor="let employee of filteredEmployees" class="employee-card"
       [class.has-published-schedule]="hasPublishedScheduleToday(employee)"
       (click)="selectEmployee(employee)">
    <div class="initials-circle"
         [class.on-shift]="isOnShift(employee.statusShiftWork) || isInProgress(employee)"
         [class.scheduled]="hasPublishedScheduleToday(employee)">
      <span class="initials">{{ getInitials(employee.name) }}</span>
      <div *ngIf="isOnShift(employee.statusShiftWork) || isInProgress(employee)" class="status-indicator">
        <i class="fas fa-check-circle"></i>
      </div>
      <div *ngIf="hasPendingScheduleToday(employee) && !isOnShift(employee.statusShiftWork) && !isInProgress(employee)" class="schedule-indicator">
        <i class="bi bi-calendar-check"></i>
      </div>
    </div>
    <div class="employee-name">
      {{ employee.name }}
      <span *ngIf="getTiming(employee.statusShiftWork) as timing" class="badge ms-2" [ngClass]="getTimingBadgeClass(timing)"
            i18n-title="@@kiosk_employees.timing_title" title="Shift arrival timing">
        {{ timing }}
      </span>
    </div>
    <div class="subtle-label on-shift-label" *ngIf="isInProgress(employee) || isOnShift(employee.statusShiftWork)"
         i18n-title="@@kiosk_employees.on_shift_title" title="Currently on shift" i18n="@@kiosk_employees.on_shift_label">
      On Shift
    </div>
    <div class="subtle-label" *ngIf="hasPendingScheduleToday(employee) && !isOnShift(employee.statusShiftWork) && !isInProgress(employee)"
         i18n-title="@@kiosk_employees.pending_title" title="Has a pending schedule for today" i18n="@@kiosk_employees.pending_label">
      Pending today
    </div>
    <div class="action-buttons mt-2">
      <div class="btn btn-sm btn-outline-success me-2" *ngIf="canStartShift(employee)"
           i18n-title="@@kiosk_employees.start_shift_title" title="Start Shift">
        <i class="bi bi-play-circle"></i>
        <ng-container i18n="@@kiosk_employees.start_btn">Start</ng-container>
      </div>
      <div class="btn btn-sm btn-outline-danger" *ngIf="canEndShift(employee)"
           i18n-title="@@kiosk_employees.end_shift_title" title="End Shift">
        <i class="bi bi-stop-circle"></i>
        <ng-container i18n="@@kiosk_employees.end_btn">End</ng-container>
      </div>
    </div>
  </div>
</div>
