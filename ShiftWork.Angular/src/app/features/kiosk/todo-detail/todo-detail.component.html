<div *ngIf="loading" class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only" i18n="@@common.loading_short">Loading...</span>
  </div>
</div>
<div *ngIf="error" class="alert alert-danger" i18n="@@kiosk_todo_detail.error">
  Error loading task.
</div>
<div class="container" *ngIf="task">
  <div class="card">
    <div class="card-header">
      <h4 class="card-title">{{ task.title }}</h4>
    </div>
  </div>
</div>
