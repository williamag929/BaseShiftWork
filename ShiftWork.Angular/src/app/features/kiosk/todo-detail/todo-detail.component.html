<div class="space-y-4 p-6">
  @if (loading) {
    <div role="status" class="flex items-center justify-center gap-3 py-10 text-lg text-ink-soft">
      <mat-spinner diameter="32" aria-hidden="true"></mat-spinner>
      <span i18n="@@common.loading_short">Loading...</span>
    </div>
  } @else if (error) {
    <lz-alert tone="danger" class="text-lg" i18n="@@kiosk_todo_detail.error">Error loading task.</lz-alert>
  } @else if (task) {
    <lz-panel>
      <h2 class="m-0 font-display text-2xl font-semibold">{{ task.title }}</h2>
    </lz-panel>
  }
</div>
