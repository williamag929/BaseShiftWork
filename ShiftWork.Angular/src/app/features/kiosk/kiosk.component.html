<div class="flex h-full flex-col bg-canvas text-ink">
  <header class="flex flex-wrap items-center justify-between gap-4 bg-navy-900 px-6 py-4 text-paper">
    <div class="flex min-w-0 items-center gap-4">
      <div class="flex size-16 shrink-0 items-center justify-center rounded-panel bg-navy-700" aria-hidden="true">
        <mat-icon class="size-9! text-4xl">apartment</mat-icon>
      </div>
      <div class="min-w-0">
        <p class="m-0 truncate text-2xl font-semibold" data-testid="company-name">{{ activeCompany?.name }}</p>
        <h1 class="m-0 text-lg font-medium text-rail-text" i18n="@@kiosk.label">Employee kiosk</h1>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-6">
        <div class="text-right md:hidden" data-testid="digital-clock">
          <div class="text-3xl font-semibold tabular-nums leading-none">{{ currentTime | date: 'shortTime' }}</div>
          <div class="text-lg text-rail-text">{{ currentTime | date: 'mediumDate' }}</div>
        </div>
        <app-analog-clock class="hidden md:block"></app-analog-clock>
      </div>

      @if (selectedLocation) {
        <button type="button" lzButton variant="secondary" iconOnly class="min-h-14! w-14!"
                (click)="openLocationSettings()"
                i18n-title="@@kiosk.change_location_title" title="Change location"
                i18n-aria-label="@@kiosk.change_location_aria" aria-label="Change device location">
          <mat-icon aria-hidden="true">settings</mat-icon>
        </button>
      }
    </div>
  </header>

  <main class="min-h-0 flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-line bg-paper px-6 py-3">
    <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between gap-2 text-lg text-ink-soft">
      <span class="inline-flex items-center gap-2">
        <mat-icon aria-hidden="true">verified_user</mat-icon>
        <ng-container i18n="@@kiosk.footer_system">Secure employee time tracking system</ng-container>
      </span>
      <span class="inline-flex items-center gap-2">
        <mat-icon aria-hidden="true">schedule</mat-icon>
        {{ currentTime | date: 'EEEE, MMMM d, y' }}
      </span>
    </div>
  </footer>
</div>
