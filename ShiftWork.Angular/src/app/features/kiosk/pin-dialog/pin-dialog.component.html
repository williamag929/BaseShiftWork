<h1 mat-dialog-title i18n="@@kiosk_pin.title">Enter PIN for {{ data.name }}</h1>
<div mat-dialog-content>
  <form [formGroup]="pinForm" (ngSubmit)="onSubmit()">
    <mat-form-field>
      <mat-label i18n="@@kiosk_pin.pin_label">PIN</mat-label>
      <input matInput formControlName="pin" type="password" maxlength="4" autocomplete="off">
      <mat-error *ngIf="pinForm.get('pin')?.hasError('required')" i18n="@@kiosk_pin.error_required">PIN is required.</mat-error>
      <mat-error *ngIf="pinForm.get('pin')?.hasError('minlength') || pinForm.get('pin')?.hasError('maxlength')" i18n="@@kiosk_pin.error_length">PIN must be 4 digits.</mat-error>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()" i18n="@@common.cancel">Cancel</button>
  <button mat-button [disabled]="!pinForm.valid" (click)="onSubmit()" i18n="@@kiosk_pin.submit_btn">Submit</button>
</div>
