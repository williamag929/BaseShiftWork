<lz-dialog-frame title="Enter PIN for {{ data.name }}" i18n-title="@@kiosk_pin.title" [closable]="true" (closed)="onNoClick()">
  <form id="kiosk-pin-form" [formGroup]="pinForm" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
    <lz-field label="PIN" i18n-label="@@kiosk_pin.pin_label" controlId="kiosk-pin" [error]="fieldError">
      <input lzField id="kiosk-pin" formControlName="pin" type="password" inputmode="none" autocomplete="off"
             class="min-h-16! text-center text-2xl! tracking-widest"
             [attr.maxlength]="pinLength" cdkFocusInitial
             [attr.aria-invalid]="fieldError ? 'true' : null"
             [attr.aria-describedby]="fieldError ? 'kiosk-pin-error' : null" />
    </lz-field>

    @if (errorMessage) {
      <lz-alert tone="danger" class="text-lg">{{ errorMessage }}</lz-alert>
    }

    <div class="grid grid-cols-3 gap-3" role="group" aria-label="PIN keypad" i18n-aria-label="@@kiosk_pin.keypad_aria">
      @for (digit of digits; track digit) {
        <button type="button" data-testid="pin-key"
                class="min-h-16 min-w-16 rounded-control border border-line-strong bg-paper text-2xl font-semibold text-ink"
                (click)="pressDigit(digit)">{{ digit }}</button>
      }
      <button type="button" data-testid="pin-clear"
              class="min-h-16 min-w-16 rounded-control border border-line-strong bg-paper text-lg font-medium text-ink"
              (click)="clearPin()" i18n="@@kiosk_pin.clear_btn">Clear</button>
      <button type="button" data-testid="pin-key"
              class="min-h-16 min-w-16 rounded-control border border-line-strong bg-paper text-2xl font-semibold text-ink"
              (click)="pressDigit('0')">0</button>
      <button type="button" data-testid="pin-backspace"
              class="inline-flex min-h-16 min-w-16 items-center justify-center rounded-control border border-line-strong bg-paper text-ink"
              (click)="backspace()" aria-label="Delete last digit" i18n-aria-label="@@kiosk_pin.backspace_aria">
        <mat-icon aria-hidden="true">backspace</mat-icon>
      </button>
    </div>
  </form>

  <div lzDialogActions class="flex w-full gap-3">
    <button type="button" lzButton variant="secondary" class="min-h-14! flex-1 text-lg!" (click)="onNoClick()" i18n="@@common.cancel">Cancel</button>
    <button type="button" lzButton variant="primary" class="min-h-14! flex-1 text-lg!" [disabled]="!pinForm.valid || verifying" (click)="onSubmit()" i18n="@@kiosk_pin.submit_btn">Submit</button>
  </div>
</lz-dialog-frame>
