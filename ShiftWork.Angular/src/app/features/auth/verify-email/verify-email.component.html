<lz-auth-shell title="Thank you for registering" i18n-title="@@auth.verify_email.title">
  @if (authService.user$ | async; as user) {
    <p i18n="@@auth.verify_email.sent">We have sent a confirmation email to <strong>{{ user.email }}</strong>.</p>
    <p class="mt-2 text-ink-soft" i18n="@@auth.verify_email.instruction">Please check your email and click on the link to verify your email address.</p>
  }

  <button type="button" lzButton variant="primary" class="mt-4 w-full" (click)="resendVerificationMail()" [disabled]="loading">
    <ng-container i18n="@@auth.verify_email.resend">Resend verification email</ng-container>
  </button>

  <p class="mt-4 text-ink-soft">
    <span i18n="@@auth.forgot_password.go_back_to">Go back to</span>
    <a routerLink="/auth/sign-in" class="ml-1 inline-flex min-h-12 items-center font-medium text-link underline" i18n="@@auth.login.title">Sign in</a>
  </p>
</lz-auth-shell>
