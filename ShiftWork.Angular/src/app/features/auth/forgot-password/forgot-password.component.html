<lz-auth-shell
  title="Reset password"
  i18n-title="@@auth.forgot_password.reset_title"
  subtitle="Please enter your email address to request a password reset."
  i18n-subtitle="@@auth.forgot_password.instruction"
>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="requestPasswordReset()" class="flex flex-col gap-4">
    <lz-field label="Email address" i18n-label="@@auth.forgot_password.email_label" controlId="email">
      <input
        lzField
        type="email"
        id="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid ? 'true' : null"
      />
      @if (forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid) {
        <p role="alert" class="mt-1 text-[13px] text-danger-ink">
          @if (forgotPasswordForm.get('email')?.errors?.['required']) {
            <span i18n="@@auth.login.email_required">Email is required</span>
          } @else {
            <span i18n="@@auth.login.email_invalid">Please enter a valid email</span>
          }
        </p>
      }
    </lz-field>

    <button type="submit" lzButton variant="primary" class="w-full" [disabled]="!forgotPasswordForm.valid || loading">
      <ng-container i18n="@@auth.forgot_password.reset_submit">Reset password</ng-container>
    </button>
  </form>

  <p class="mt-4 text-ink-soft">
    <span i18n="@@auth.forgot_password.go_back_to">Go back to</span>
    <a routerLink="/auth/sign-in" class="ml-1 inline-flex min-h-12 items-center font-medium text-link underline" i18n="@@auth.login.title">Sign in</a>
  </p>
</lz-auth-shell>
