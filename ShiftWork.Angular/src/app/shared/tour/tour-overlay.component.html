<ng-container *ngIf="active && step">
  <div class="tour-backdrop" role="presentation"></div>

  <div
    class="tour-tooltip"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="step.title"
    [style.top.px]="tooltipTop"
    [style.left.px]="tooltipLeft"
  >
    <div class="mb-2 flex items-center justify-between gap-2">
      <p class="lz-eyebrow text-ink-soft">
        <ng-container i18n="@@tour.step_counter">Step {{ stepIndex + 1 }} of {{ totalSteps }}</ng-container>
      </p>
      <button lzButton variant="quiet" iconOnly type="button" class="-mr-2" (click)="endTour()" aria-label="Close tour" i18n-aria-label="@@tour.close">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>

    <h2 class="font-display text-[18px] font-semibold leading-snug text-ink">{{ step.title }}</h2>
    <p class="mt-2 text-ink-muted">{{ step.content }}</p>

    <div class="mt-4 flex items-center gap-1.5" aria-hidden="true">
      <span
        *ngFor="let s of tour.steps; let i = index"
        class="h-1.5 flex-1 rounded-chip transition-colors"
        [ngClass]="i <= stepIndex ? 'bg-navy-800' : 'bg-line'"
      ></span>
    </div>

    <div class="mt-4 flex items-center justify-between gap-2">
      <button lzButton variant="quiet" type="button" class="-ml-2" (click)="endTour()" i18n="@@tour.skip">Skip</button>
      <div class="flex gap-2">
        <button *ngIf="stepIndex > 0" lzButton variant="secondary" type="button" (click)="prev()" i18n="@@tour.back">Back</button>
        <button lzButton variant="primary" type="button" (click)="next()">
          <ng-container *ngIf="stepIndex === totalSteps - 1; else nextLabel" i18n="@@tour.finish">Finish</ng-container>
          <ng-template #nextLabel><ng-container i18n="@@tour.next">Next</ng-container></ng-template>
        </button>
      </div>
    </div>
  </div>
</ng-container>
