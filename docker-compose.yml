name: shiftwork

services:

  # ── SQL Server ──────────────────────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shiftwork-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-Your_password123}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - shiftwork-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API (.NET 9) ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./ShiftWork.Api
      dockerfile: Dockerfile
    image: shiftwork/api:local
    container_name: shiftwork-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://0.0.0.0:80"
      # Database (value comes from the root .env — DB_CONNECTION_STRING)
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING}"
      # Firebase
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN}"
      FIREBASE_API_KEY: "${FIREBASE_API_KEY}"
      # AWS S3
      AWS_REGION: "${AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      # Email (SMTP)
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      Smtp__From: "${SMTP_FROM}"
      # Push notifications
      EXPO_PUSH_API_URL: "${EXPO_PUSH_API_URL:-https://exp.host/--/api/v2/push/send}"
      # Weather (daily reports)
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY}"
      # Observability — must match prometheus's copy of the same var below, or every scrape 401s.
      METRICS_SCRAPE_TOKEN: "${METRICS_SCRAPE_TOKEN}"
    ports:
      - "5000:80"
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - shiftwork-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Angular web (nginx) ─────────────────────────────────────────────────────
  web:
    build:
      context: ./ShiftWork.Angular
      dockerfile: Dockerfile
    image: shiftwork/web:local
    container_name: shiftwork-web
    environment:
      API_URL: "http://api:80"
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shiftwork-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MCP Python server ───────────────────────────────────────────────────────
  mcp:
    build:
      context: ./python_client
      dockerfile: Dockerfile
    image: shiftwork/mcp:local
    container_name: shiftwork-mcp
    environment:
      API_BASE_URL: "http://api:80"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN}"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shiftwork-net

  # ── Prometheus ──────────────────────────────────────────────────────────────
  # Not rebuilt by deploy.yml's `docker compose up -d --build mcp api web` (it doesn't need
  # rebuilding on every API deploy) — starts once via the initial `docker compose up -d` and keeps
  # running across subsequent deploys of the other services.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: shiftwork-prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$METRICS_SCRAPE_TOKEN" > /etc/prometheus/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    environment:
      METRICS_SCRAPE_TOKEN: "${METRICS_SCRAPE_TOKEN}"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shiftwork-net

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.1
    container_name: shiftwork-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
      GF_SMTP_ENABLED: "${SMTP_HOST:+true}"
      GF_SMTP_HOST: "${SMTP_HOST}:${SMTP_PORT:-587}"
      GF_SMTP_USER: "${SMTP_USERNAME}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_FROM}"
      GRAFANA_ALERT_EMAIL: "${GRAFANA_ALERT_EMAIL:-ops@example.com}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - shiftwork-net

volumes:
  mssql-data:
  prometheus-data:
  grafana-data:

networks:
  shiftwork-net:
    driver: bridge
