# ShiftWork Mobile — local Expo dev server
# Run: docker compose up mobile-dev
# Note: for physical device testing, --tunnel requires an Expo account (EXPO_TOKEN env var)

services:
  mobile-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shiftwork-mobile-dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
    networks:
      - shiftwork-net

  mobile-web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        EXPO_PUBLIC_API_URL: ${API_URL:-http://localhost:5000}
        EXPO_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        EXPO_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    container_name: shiftwork-mobile-web
    ports:
      - "3000:80"
    networks:
      - shiftwork-net
    profiles:
      - production

networks:
  shiftwork-net:
    external: true
    name: shiftwork_shiftwork-net
